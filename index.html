<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#C4702A;--primary-bg:#FFF6EB;--primary-light:#E8D4B8;
  --green:#2E9D5A;--red:#D9534F;--blue:#4A90D9;
  --text-primary:#333;--text-secondary:#888;--text-light:#aaa;
  --bg:#F7F5F2;--card-bg:#fff;--border:#EDE8E0;
  --shadow:0 2px 12px rgba(0,0,0,.06);--radius:14px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;background:var(--bg);color:var(--text-primary);-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* Header */
.header{position:sticky;top:0;z-index:100;background:var(--card-bg);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.header-left{display:flex;align-items:center;gap:8px}
.header-logo{width:32px;height:32px;border-radius:8px;object-fit:cover;flex-shrink:0}
.header-title{font-size:18px;font-weight:700;letter-spacing:.5px}
.header-right{display:flex;align-items:center;gap:18px}
.header-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-primary);cursor:pointer;-webkit-tap-highlight-color:transparent}

/* Banner */
.banner{background:linear-gradient(135deg,#FFF6EB 0%,#FFE8CC 50%,#FFDAB3 100%);padding:14px 16px}
.stats-container{display:flex;align-items:center;gap:14px}
.progress-ring-wrap{flex-shrink:0;position:relative;width:106px;height:106px}
.progress-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.progress-label{font-size:11px;color:var(--text-secondary)}
.progress-value{font-size:20px;font-weight:800;color:var(--primary);line-height:1.2;white-space:nowrap}
.stats-list{flex:1;display:flex;flex-direction:column;gap:7px}
.stat-row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.65);padding:9px 14px;border-radius:10px}
.stat-label{font-size:13px;color:var(--text-secondary)}
.stat-value{font-size:17px;font-weight:800;color:var(--primary)}

/* Search */
.search-bar{padding:10px 16px;background:var(--bg)}
.search-input-wrap{display:flex;align-items:center;background:var(--card-bg);border-radius:12px;padding:10px 14px;border:1px solid var(--border)}
.search-icon{font-size:17px;color:var(--text-light);margin-right:8px}
.search-input{flex:1;border:none;outline:none;font-size:15px;background:transparent;color:var(--text-primary)}
.search-input::placeholder{color:var(--text-light)}

/* Main Layout */
.main-layout{display:flex;min-height:calc(100vh - 200px);padding-bottom:80px}

/* Sidebar */
.sidebar{width:66px;flex-shrink:0;padding:8px 3px 8px 6px}
.sidebar-item{display:flex;flex-direction:column;align-items:center;padding:10px 2px;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;margin-bottom:2px}
.sidebar-item.active{background:var(--primary-bg)}
.sidebar-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;margin-bottom:3px}
.sidebar-name{font-size:11px;color:var(--text-secondary);line-height:1.2;text-align:center}
.sidebar-count{min-width:16px;height:16px;border-radius:8px;background:var(--primary);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;margin-top:2px}
.sidebar-item.active .sidebar-name{color:var(--primary);font-weight:600}

/* Sidebar Sub-items */
.sidebar-sub-item{display:flex;align-items:center;gap:5px;padding:5px 3px 5px 9px;margin:1px 0;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:8px;position:relative}
.sidebar-sub-item::before{content:'';position:absolute;left:3px;top:50%;transform:translateY(-50%);width:2px;height:60%;background:var(--border);border-radius:1px}
.sidebar-sub-item.active{background:var(--primary-bg)}
.sidebar-sub-item.active::before{background:var(--primary)}
.sidebar-sub-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sidebar-sub-name{font-size:10px;color:var(--text-secondary);line-height:1.1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-sub-count{min-width:14px;height:14px;border-radius:7px;background:var(--primary);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;flex-shrink:0}
.sidebar-sub-item.active .sidebar-sub-name{color:var(--primary);font-weight:600}

/* Home Dashboard */
.home-dashboard{padding:0 4px}
.home-hero{background:linear-gradient(135deg,#FFF6EB 0%,#FFE8CC 50%,#FFDAB3 100%);border-radius:var(--radius);padding:20px;margin-bottom:12px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow)}
.home-pie-wrap{flex-shrink:0;position:relative;width:110px;height:110px}
.home-pie-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.home-pie-label{font-size:11px;color:var(--text-secondary)}
.home-pie-val{font-size:18px;font-weight:800;color:var(--primary);line-height:1.2;white-space:nowrap}
.home-hero-legend{flex:1;min-width:0}
.home-leg-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:13px;font-weight:600}
.home-leg-dot{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:middle}
.home-stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:6px}
.home-stat{background:var(--card-bg);border-radius:12px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.home-stat-label{font-size:12px;color:var(--text-secondary);margin-bottom:6px}
.home-stat-val{font-size:16px;font-weight:800;white-space:nowrap}
.home-stat-val.expense{color:var(--primary)}
.home-stat-val.income{color:var(--green)}
.home-stat-val.balance-pos{color:var(--green)}
.home-stat-val.balance-neg{color:var(--primary)}

/* Content Area */
.content-area{flex:1;padding:0 10px 12px 0;min-width:0}
.section-header{display:flex;align-items:center;gap:8px;padding:13px 4px 7px}
.section-title{font-size:15px;font-weight:700;color:var(--text-primary)}
.section-count{min-width:22px;height:22px;border-radius:11px;background:var(--primary);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 6px;font-weight:600}

/* Record Card - Match 图1 exactly */
.record-card{background:var(--card-bg);border-radius:var(--radius);padding:13px 15px;margin-bottom:11px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;transition:transform .15s;cursor:pointer;position:relative;overflow:hidden}
.record-card:active{transform:scale(.98)}
.record-card.pending{border-left:4px solid var(--primary)}
.record-card.settled{border-left:4px solid var(--green)}
.card-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0}
.card-info{flex:1;min-width:0;overflow:hidden}
.card-name-row{display:flex;align-items:center;gap:5px}
.card-name{font-size:16px;font-weight:800;color:var(--text-primary);white-space:nowrap}
.card-cat{font-size:11px;color:var(--text-secondary);background:var(--bg);padding:2px 7px;border-radius:8px;flex-shrink:0}
.card-date{font-size:11px;color:var(--text-light);margin-top:3px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.card-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0}
.card-right{text-align:right;flex-shrink:0;min-width:72px}
.card-amount{font-size:19px;font-weight:900;white-space:nowrap;line-height:1.25}
.card-amount.negative{color:var(--primary)}
.card-amount.positive{color:var(--green)}
.card-status{font-size:12px;color:var(--text-secondary);margin-top:1px}
.card-actions{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.action-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent;color:var(--text-secondary)}
.action-btn.check{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:bold}
.action-btn.delete{color:var(--red);border-color:#FFE0E0;background:#FFF5F5}
.card-chevron{color:var(--text-light);font-size:20px;flex-shrink:0}

/* FAB */
.fab{position:fixed;right:20px;bottom:calc(24px + var(--safe-bottom));width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(196,112,42,.35);cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:90;border:none;transition:transform .2s}
.fab:active{transform:scale(.92)}

/* Modal Overlay */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--card-bg);border-radius:22px 22px 0 0;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;padding:24px 20px;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1)}
.modal-overlay.show .modal{transform:translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:19px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:none;color:var(--text-secondary)}

/* Type Tabs */
.type-tabs{display:flex;background:var(--primary-bg);border-radius:12px;padding:3px;margin-bottom:18px}
.type-tab{flex:1;padding:11px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;background:transparent;color:var(--text-secondary)}
.type-tab.active{background:var(--card-bg);color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* Paste Button in Form */
.paste-btn-inline{width:100%;padding:15px;border:2px dashed var(--primary);border-radius:14px;background:#FFF9F2;color:var(--primary);font-size:15px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.5px}
.paste-btn-inline:active{opacity:.75;transform:scale(.99);transition:transform .1s}

/* Form */
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:7px}
.form-input,.form-textarea{width:100%;padding:14px 15px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;color:var(--text-primary);outline:none;background:var(--bg);transition:border-color .2s;font-family:inherit}
.form-input:focus,.form-textarea:focus{border-color:var(--primary)}
.form-textarea{resize:vertical;min-height:56px}
.form-input-center{text-align:center;font-size:30px;font-weight:400;letter-spacing:3px;color:var(--primary);padding:16px 15px}
.btn-save{width:100%;padding:16px;border-radius:14px;background:var(--primary);color:#fff;font-size:17px;font-weight:700;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;margin-top:10px;margin-bottom:calc(12px + var(--safe-bottom))}
.btn-save:active{opacity:.85}

/* Category Grid */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-btn{padding:13px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;font-weight:600;color:var(--text-secondary);background:var(--card-bg);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;text-align:center}
.cat-btn.full{grid-column:span 2}
.cat-btn.selected{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}

/* Balance Overview Page */
.balance-page{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:155;transform:translateX(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);overflow-y:auto}
.balance-page.show{transform:translateX(0)}
.balance-header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#C4702A 0%,#D4853F 40%,#E8A060 100%);padding:14px 16px 22px;color:#fff}
.balance-nav{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.balance-back{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:#fff;flex-shrink:0}
.balance-title{font-size:19px;font-weight:700;flex:1}

/* Global Summary Card */
.balance-global{background:rgba(255,255,255,.15);border-radius:16px;padding:20px;display:flex;align-items:center;gap:18px}
.balance-pie-wrap{flex-shrink:0;position:relative;width:110px;height:110px}
.balance-pie-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.balance-pie-label{font-size:11px;color:rgba(255,255,255,.75)}
.balance-pie-val{font-size:17px;font-weight:800;color:#fff;line-height:1.2}
.balance-legend{flex:1}
.balance-leg-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:13px}
.balance-leg-dot{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:8px;vertical-align:middle}
.balance-leg-val{font-weight:700;font-size:15px}

/* Per-Person Balance Card */
.person-balance-card{background:var(--card-bg);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .15s;border-left:4px solid var(--primary)}
.person-balance-card:active{transform:scale(.98)}
.pbc-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0}
.pbc-info{flex:1;min-width:0}
.pbc-name{font-size:16px;font-weight:800}
.pbc-relation{font-size:12px;color:var(--text-secondary);margin-top:2px}
.pbc-cols{display:flex;gap:12px;text-align:right;flex-shrink:0}
.pbc-col{min-width:62px}
.pbc-col-label{font-size:10px;color:var(--text-light)}
.pbc-col-val{font-size:14px;font-weight:800;margin-top:2px}
.pbc-col-val.income{color:var(--green)}
.pbc-col-val.expense{color:var(--primary)}
.pbc-col-val.balance-neg{color:var(--primary)}
.pbc-col-val.balance-pos{color:var(--green)}

/* Person Detail - Balance Section */
.person-balance-section{margin:0 16px 16px;background:var(--primary-bg);border-radius:14px;padding:16px}
.pbs-title{font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:12px}
.pbs-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pbs-item{text-align:center;background:var(--card-bg);border-radius:10px;padding:12px 8px}
.pbs-item-label{font-size:11px;color:var(--text-secondary);margin-bottom:4px}
.pbs-item-val{font-size:17px;font-weight:800}
.pbs-item-val.income{color:var(--green)}
.pbs-item-val.expense{color:var(--primary)}
.pbs-item-val.balance-neg{color:var(--primary)}
.pbs-item-val.balance-pos{color:var(--green)}

/* Data Table */
.data-table-section{margin:0 16px 30px}
.dt-title{font-size:15px;font-weight:700;color:var(--text-primary);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.data-table{width:100%;border-collapse:collapse;background:var(--card-bg);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.data-table th{background:var(--bg);padding:10px 8px;font-size:12px;font-weight:600;color:var(--text-secondary);text-align:left;border-bottom:1px solid var(--border)}
.data-table td{padding:10px 8px;font-size:13px;border-bottom:1px solid var(--border);white-space:nowrap}
.data-table tr:last-child td{border-bottom:none}
.data-table .dt-income{color:var(--green);font-weight:600}
.data-table .dt-expense{color:var(--primary);font-weight:600}
.data-table .dt-bal-neg{color:var(--primary);font-weight:700}
.data-table .dt-bal-pos{color:var(--green);font-weight:700}

/* Person Detail Page */
.person-page{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:150;transform:translateX(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);overflow-y:auto}
.person-page.show{transform:translateX(0)}
.person-header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#FFF6EB 0%,#FFE8CC 60%,#FFDAB3 100%);padding:12px 16px 18px}
.person-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.person-back{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--text-primary);flex-shrink:0}
.person-nav-title{font-size:19px;font-weight:700;flex:1}
.person-add{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--text-primary);flex-shrink:0}
.breadcrumb{font-size:12px;color:var(--text-light);margin-bottom:14px}
.person-profile{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.person-avatar-lg{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;flex-shrink:0}
.person-name-lg{font-size:21px;font-weight:800}
.person-relation-lg{font-size:13px;color:var(--text-secondary);margin-top:2px}
.person-summary{display:flex;gap:12px;margin-bottom:14px}
.person-sum-tag{padding:6px 12px;border-radius:10px;font-size:13px;font-weight:600;background:rgba(255,255,255,.55)}
.person-sum-tag.net{color:var(--primary)}
.person-stats-body{display:flex;align-items:center;gap:14px}
.person-ring-wrap{flex-shrink:0;position:relative;width:104px;height:104px}
.person-ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.person-ring-label{font-size:10px;color:var(--text-secondary)}
.person-ring-val{font-size:19px;font-weight:800;color:var(--primary);line-height:1.2}
.person-stat-list{flex:1;display:flex;flex-direction:column;gap:6px}
.person-stat-row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.65);padding:8px 13px;border-radius:10px}
.person-stat-label{font-size:12px;color:var(--text-secondary)}
.person-stat-val{font-size:16px;font-weight:800;color:var(--primary)}

/* Timeline */
.timeline-section{padding:0 16px 30px}
.month-header{font-size:14px;font-weight:700;color:var(--text-primary);padding:16px 0 10px;border-bottom:1px solid var(--border);margin-bottom:10px}
.timeline-item{padding:14px 0;border-bottom:1px solid var(--border)}
.timeline-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:5px}
.timeline-info{flex:1;margin-left:12px}
.timeline-amount{font-size:17px;font-weight:800}
.timeline-amount.negative{color:var(--primary)}
.timeline-amount.positive{color:var(--green)}
.timeline-type{font-size:13px;color:var(--text-secondary);margin-left:6px}
.timeline-date{font-size:13px;color:var(--text-light);margin-top:3px}
.timeline-note{font-size:13px;color:var(--text-primary);margin-top:3px;font-weight:600}
.timeline-actions{display:flex;gap:8px;margin-top:10px}
.tl-action{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;-webkit-tap-highlight-color:transparent;color:var(--text-secondary)}
.tl-action.del{color:var(--red);border-color:#FFE0E0;background:#FFF5F5}

/* Empty State */
.empty-state{text-align:center;padding:40px 20px}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.3}
.empty-text{font-size:15px;color:var(--text-light);line-height:1.7}

/* Toast */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(51,51,51,.9);color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;z-index:300;opacity:0;pointer-events:none;transition:all .3s;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Confirm Dialog */
.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:250;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.confirm-overlay.show{opacity:1;pointer-events:auto}
.confirm-box{background:var(--card-bg);border-radius:16px;width:280px;padding:24px;text-align:center;transform:scale(.9);transition:transform .2s}
.confirm-overlay.show .confirm-box{transform:scale(1)}
.confirm-msg{font-size:15px;line-height:1.6;margin-bottom:20px;color:var(--text-primary);white-space:pre-line}
.confirm-btns{display:flex;gap:10px}
.confirm-btn{flex:1;padding:10px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.confirm-btn.cancel{background:var(--bg);color:var(--text-secondary)}
.confirm-btn.danger{background:var(--red);color:#fff}

/* Chart Modal */
.chart-modal .modal{max-height:82vh}
.chart-bar-row{margin-bottom:14px}
.chart-bar-label{font-size:13px;font-weight:600;margin-bottom:6px}
.chart-bar-track{background:var(--bg);border-radius:8px;height:28px;display:flex;overflow:hidden}
.chart-bar-sent{background:var(--primary);display:flex;align-items:center;padding-left:8px;font-size:11px;color:#fff;font-weight:600;transition:width .5s}
.chart-bar-rec{background:var(--green);display:flex;align-items:center;padding-left:8px;font-size:11px;color:#fff;font-weight:600;transition:width .5s}
.chart-legend{display:flex;gap:16px;margin-top:10px;font-size:12px}
.chart-legend span{display:flex;align-items:center;gap:4px}
.chart-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* Parse/Paste Modal */
.parse-hint{font-size:12px;color:var(--text-secondary);line-height:1.7;margin-bottom:14px;background:var(--primary-bg);padding:12px 14px;border-radius:12px}
.parse-hint b{color:var(--primary)}
.parse-hint code{background:rgba(196,112,42,.15);padding:1px 6px;border-radius:4px;font-size:11px;color:var(--primary)}
.paste-area{width:100%;min-height:130px;padding:14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;line-height:1.6;color:var(--text-primary);outline:none;background:var(--bg);resize:vertical;font-family:inherit;transition:border-color .2s}
.paste-area:focus{border-color:var(--primary)}
.parse-btn{width:100%;padding:13px;border-radius:12px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;margin-top:12px}
.parse-count{font-size:13px;color:var(--text-secondary);margin:14px 0 8px;font-weight:600}
.parse-item{background:var(--bg);border-radius:12px;padding:14px;margin-bottom:12px;animation:fadeInUp .3s ease}
.parse-item-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.parse-name{flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-weight:700;background:#fff;outline:none;font-family:inherit}
.parse-remove{width:32px;height:32px;border-radius:8px;background:#fff;border:1px solid #FFE0E0;color:var(--red);cursor:pointer;font-size:14px;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.parse-row{display:flex;gap:8px;margin-bottom:8px}
.parse-field{flex:1;min-width:0}
.parse-field label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:4px}
.parse-field input,.parse-field select{width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:#fff;outline:none;font-family:inherit}
.parse-footer{margin-top:6px}

@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.record-card{animation:fadeInUp .3s ease backwards}
.record-card:nth-child(1){animation-delay:0s}.record-card:nth-child(2){animation-delay:.04s}
.record-card:nth-child(3){animation-delay:.08s}.record-card:nth-child(4){animation-delay:.12s}
::-webkit-scrollbar{display:none}
</style>
</head>

      <div class="stat-row"><span class="stat-label">人情总收入</span><span class="stat-value" id="totalReceived">¥0</span></div>
      <div class="stat-row"><span class="stat-label">待回礼</span><span class="stat-value" id="pendingCount">0人</span></div>

</div>

<!-- Search -->
<div class="search-bar">
  <div class="search-input-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="searchInput" placeholder="搜索姓名..." oninput="renderMain()">
  </div>

<div class="main-layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content-area" id="contentArea"></div>

<button class="fab" onclick="openFormModal()">＋</button>

        <label class="form-label">备注（选填）</label>

      <div class="modal-title">数据统计</div>

    </div>

</div>

<!-- Paste/Recognize Modal -->
<div class="modal-overlay" id="pasteModal">
  <div class="modal" style="max-height:90vh">
    <div class="modal-header">
      <div class="modal-title">粘贴对话 · 识别随礼</div>
      <button class="modal-close" onclick="closePaste()">✕</button>
    </div>
    <div class="parse-hint">
      把你的随礼记录<b>粘贴到下方</b>，系统会自动识别。<br>
      支持格式示例：<br>
      <code>王伯伯 随礼 2000 2026-04-26</code><br>
      <code>李姐：同事结婚，转你1000元</code><br>
      <code>张磊 朋友 800 6月30日</code>
    </div>
    <textarea class="paste-area" id="pasteInput" placeholder="在此粘贴对话或随礼记录文本..."></textarea>
    <button class="parse-btn" onclick="parsePastedText()">🔍 识别提取</button>
    <div id="parsePreview"></div>
  </div>
</div>

<!-- Confirm Dialog -->

  <div class="confirm-box">
    <div class="confirm-msg" id="confirmMsg">确认操作？</div>
    <div class="confirm-btns">
      <button class="confirm-btn cancel" onclick="closeConfirm()">取消</button>
      <button class="confirm-btn danger" id="confirmOkBtn">确定</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="xlsx.min.js"></script>
<script>
// ============ Data ============
const STORAGE_KEY = 'fenziqian_data';
const CATEGORIES = [
  {key:'home', name:'首页', icon:'首', color:'var(--primary)'},
  {key:'relatives', name:'亲戚', icon:'亲', color:'#E07850', sub:true},
  {key:'colleagues', name:'同事', icon:'同', color:'#4A90D9'},
  {key:'friends', name:'朋友', icon:'朋', color:'#43A06D'},
  {key:'classmates', name:'同学', icon:'同', color:'#7B68EE'},
  {key:'others', name:'其他', icon:'其', color:'#888'}
];

const SUB_CATEGORIES = [
  {key:'mom', name:'妈妈亲戚', color:'#E07850'},
  {key:'dad', name:'爸爸亲戚', color:'#E07850'},
  {key:'inlaw', name:'婆家亲戚', color:'#E07850'}
];

let records = [];
let currentCategory = 'home';
let currentSub = null;
let editingId = null;
let currentTypeTab = 'sent';

// ============ Init ============
function init() {
  loadData();
  renderSidebar();
  renderStats();
  renderSubCatGrid();
  renderCatGrid();
  renderMain();
  registerSW();
}

// Register Service Worker for offline / installable PWA
function registerSW() {
  if('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    records = raw ? JSON.parse(raw) : [];
  } catch(e) { records = []; }
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }

// ============ Stats ============
function renderStats() {
  const totalSent = records.filter(r=>r.type==='sent').reduce((s,r)=>s+r.amount,0);
  const totalReceived = records.filter(r=>r.type==='received').reduce((s,r)=>s+r.amount,0);
  const pendingRecords = records.filter(r=>r.status==='pending');
  const net = totalReceived - totalSent;

  document.getElementById('netValue').textContent = formatCurrency(net);
  document.getElementById('totalSent').textContent = formatCurrency(totalSent);
  document.getElementById('totalReceived').textContent = formatCurrency(totalReceived);
  document.getElementById('pendingCount').textContent = pendingRecords.length + '人';

  const circle = document.getElementById('progressCircle');
  const maxVal = Math.max(Math.abs(totalSent), Math.abs(totalReceived), 1);
  const pct = Math.min(Math.abs(net)/maxVal, 1);
  circle.style.strokeDashoffset = 276.46 * (1 - pct);
  circle.style.stroke = net >= 0 ? '#2E9D5A' : '#C4702A';
}

// ============ Sidebar ============
function renderSidebar() {
  let html = '';
  CATEGORIES.forEach(cat=>{
    const count = cat.key==='home' ? records.length : records.filter(r=>r.relation===cat.key).length;
    html += `<div class="sidebar-item ${currentCategory===cat.key?'active':''}" onclick="setCategory('${cat.key}')">
      <div class="sidebar-avatar" style="background:${cat.color}">${cat.icon}</div>
      <div class="sidebar-name">${cat.name}</div>
      ${count>0?`<div class="sidebar-count">${count}</div>`:''}
    </div>`;
    if(cat.sub && currentCategory===cat.key) {
      SUB_CATEGORIES.forEach(sub=>{
        const sc = records.filter(r=>r.relation===cat.key && r.subRelation===sub.key).length;
        html += `<div class="sidebar-sub-item ${currentSub===sub.key?'active':''}" onclick="setSub('${sub.key}')">
          <span class="sidebar-sub-dot" style="background:${sub.color}"></span>
          <span class="sidebar-sub-name">${sub.name}</span>
          ${sc>0?`<span class="sidebar-sub-count">${sc}</span>`:''}
        </div>`;
      });
    }
  });
  document.getElementById('sidebar').innerHTML = html;
}
function setCategory(key) { currentCategory=key; currentSub=null; renderSidebar(); renderMain(); }
function setSub(subKey) { currentCategory='relatives'; currentSub=subKey; renderSidebar(); renderMain(); }

// ============ Main Router ============
function renderMain() {
  const searchBar = document.querySelector('.search-bar');
  const showSearch = currentCategory !== 'home';
  if(searchBar) searchBar.style.display = showSearch ? '' : 'none';
  if(currentCategory === 'home') { renderHomeDashboard(); }
  else { renderList(); }
}

// ============ List ============
function renderList() {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  let filtered = records;
  if(currentCategory!=='home') filtered=filtered.filter(r=>r.relation===currentCategory);
  if(currentSub) filtered=filtered.filter(r=>r.subRelation===currentSub);
  if(keyword) filtered=filtered.filter(r=>r.name.toLowerCase().includes(keyword));

  // Group by person for list view
  const byName = {};
  filtered.forEach(r => {
    if(!byName[r.name]) byName[r.name] = [];
    byName[r.name].push(r);
  });

  const el = document.getElementById('contentArea');
  if(filtered.length === 0) {
    el.innerHTML=`<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-text">暂无记录<br>点击右下角 ＋ 记一笔</div></div>`;
    return;
  }

  // Show pending first, then settled
  const pendingNames = Object.keys(byName).filter(n => byName[n].some(r=>r.status==='pending'));
  const settledNames = Object.keys(byName).filter(n => !byName[n].some(r=>r.status==='pending'));

  let html = '';
  if(pendingNames.length > 0) {
    html += `<div class="section-header"><div class="section-title">待回礼</div><div class="section-count">${pendingNames.reduce((s,n)=>s+byName[n].filter(r=>r.status==='pending').length,0)}</div></div>`;
    pendingNames.forEach(name => {
      const recs = byName[name];
      const latest = recs[recs.length-1];
      const cat = CATEGORIES.find(c=>c.key===latest.relation)||CATEGORIES[5];
      const isNeg = latest.type==='sent';
      html += `<div class="record-card ${latest.status}" onclick="openPersonPage('${name}')">
        <div class="card-avatar" style="background:${cat.color}">${name.charAt(0)}</div>
        <div class="card-info">
          <div class="card-name-row"><span class="card-name">${name}</span><span class="card-cat" style="color:${cat.color}">${cat.name}</span></div>
          <div class="card-date">${formatDateMD(latest.date)}${latest.note?' · '+latest.note:''}</div>
        </div>
        <div class="card-dot"></div>
        <div class="card-right">
          <div class="card-amount ${isNeg?'negative':'positive'}">${isNeg?'-':'+'}${latest.amount.toLocaleString()}</div>
          <div class="card-status">${statusText(latest)}</div>
        </div>
        <div class="card-actions" onclick="event.stopPropagation()">
          <button class="action-btn" onclick="openEditModal(${latest.id})" title="编辑">✎</button>
          ${latest.status==='pending'?`<button class="action-btn check" onclick="markSettled(${latest.id})" title="结清">✓</button>`:''}
          <button class="action-btn delete" onclick="confirmDelete(${latest.id})" title="删除">🗑</button>
        </div>
        <div class="card-chevron">›</div>
      </div>`;
    });
  }
  if(settledNames.length > 0) {
    html += `<div class="section-header"><div class="section-title">已结清</div><div class="section-count">${settledNames.reduce((s,n)=>s+byName[n].length,0)}</div></div>`;
    settledNames.forEach(name => {
      const recs = byName[name];
      const latest = recs[recs.length-1];
      const cat = CATEGORIES.find(c=>c.key===latest.relation)||CATEGORIES[5];
      const isNeg = latest.type==='sent';
      html += `<div class="record-card ${latest.status}" onclick="openPersonPage('${name}')">
        <div class="card-avatar" style="background:${cat.color}">${name.charAt(0)}</div>
        <div class="card-info">
          <div class="card-name-row"><span class="card-name">${name}</span><span class="card-cat" style="color:${cat.color}">${cat.name}</span></div>
          <div class="card-date">${formatDateMD(latest.date)}${latest.note?' · '+latest.note:''}</div>
        </div>
        <div class="card-dot"></div>
        <div class="card-right">
          <div class="card-amount ${isNeg?'negative':'positive'}">${isNeg?'-':'+'}${latest.amount.toLocaleString()}</div>
          <div class="card-status">${statusText(latest)}</div>
        </div>
        <div class="card-actions" onclick="event.stopPropagation()">
          <button class="action-btn" onclick="openEditModal(${latest.id})" title="编辑">✎</button>
          <button class="action-btn delete" onclick="confirmDelete(${latest.id})" title="删除">🗑</button>
        </div>
        <div class="card-chevron">›</div>
      </div>`;
    });
  }
  el.innerHTML = html;
}

function statusText(r) {
  if(r.status === 'pending') return '已过' + daysSince(r.date) + '天';
  return r.type === 'received' ? '收回' : '已结清';
}

// ============ Home Dashboard ============
function renderHomeDashboard() {
  const totalIncome = records.filter(r=>r.type==='received').reduce((s,r)=>s+r.amount,0);
  const totalExpense = records.filter(r=>r.type==='sent').reduce((s,r)=>s+r.amount,0);
  const net = totalIncome - totalExpense;
  const C = 2 * Math.PI * 46; // circumference for r=46
  const incomeLen = C * (totalIncome / Math.max(totalIncome+totalExpense,1));
  const expenseLen = C * (totalExpense / Math.max(totalIncome+totalExpense,1));

  let html = `<div class="home-dashboard">
    <div class="home-hero">
      <div class="home-pie-wrap">
        <svg width="110" height="110" viewBox="0 0 110 110">
          <circle cx="55" cy="55" r="46" fill="none" stroke="#F0DDD0" stroke-width="16"/>
          <circle cx="55" cy="55" r="46" fill="none" stroke="#2E9D5A" stroke-width="16" stroke-linecap="round" stroke-dasharray="${incomeLen.toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 55 55)"/>
          <circle cx="55" cy="55" r="46" fill="none" stroke="#C4702A" stroke-width="16" stroke-linecap="round" stroke-dasharray="${expenseLen.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="-${incomeLen.toFixed(2)}" transform="rotate(-90 55 55)"/>
        </svg>
        <div class="home-pie-text">
          <div class="home-pie-label">净盈亏</div>
          <div class="home-pie-val">${formatCurrency(net)}</div>
        </div>
      </div>
      <div class="home-hero-legend">
        <div class="home-leg-row"><span><span class="home-leg-dot" style="background:#2E9D5A"></span>人情收入</span><span style="color:var(--green)">${formatCurrency(totalIncome)}</span></div>
        <div class="home-leg-row"><span><span class="home-leg-dot" style="background:#C4702A"></span>人情支出</span><span style="color:var(--primary)">${formatCurrency(totalExpense)}</span></div>
      </div>
    </div>
    <div class="home-stat-grid">
      <div class="home-stat"><div class="home-stat-label">总人情支出</div><div class="home-stat-val expense">${formatCurrency(totalExpense)}</div></div>
      <div class="home-stat"><div class="home-stat-label">总人情收入</div><div class="home-stat-val income">${formatCurrency(totalIncome)}</div></div>
      <div class="home-stat"><div class="home-stat-label">人情结余</div><div class="home-stat-val ${net>=0?'balance-pos':'balance-neg'}">${formatCurrency(net)}</div></div>
    </div>
  </div>`;

  document.getElementById('contentArea').innerHTML = html;
}

// ============ Person Detail Page ============
let currentPersonName = '';
function openPersonPage(name) {
  currentPersonName = name;
  const personRecs = records.filter(r=>r.name===name);
  if(!personRecs.length) return;

  const cat = CATEGORIES.find(c=>c.key===personRecs[0].relation)||CATEGORIES[5];
  const sentTotal = personRecs.filter(r=>r.type==='sent').reduce((s,r)=>s+r.amount,0);
  const recTotal = personRecs.filter(r=>r.type==='received').reduce((s,r)=>s+r.amount,0);
  const net = recTotal - sentTotal;
  const pendingCount = personRecs.filter(r=>r.status==='pending').length;
  // 待随礼 = 我送出但对方还没还的（我欠别人的）
  const pendingSent = personRecs.filter(r=>r.type==='sent'&&r.status==='pending').reduce((s,r)=>s+r.amount,0);
  // 待收礼 = 对方送给我但我还没还的（别人欠我的）
  const pendingRec = personRecs.filter(r=>r.type==='received'&&r.status==='pending').reduce((s,r)=>s+r.amount,0);

  // Header
  document.getElementById('personHeader').innerHTML = `
    <div class="person-nav">
      <div class="person-back" onclick="closePersonPage()">‹</div>
      <div class="person-nav-title">${name}</div>
      <div class="person-add" onclick="closePersonPage();openFormModalFor('${name}')">＋</div>
    </div>
    <div class="breadcrumb">份子钱工作台 / ${name}</div>
    <div class="person-profile">
      <div class="person-avatar-lg" style="background:${cat.color}">${name.charAt(0)}</div>
      <div>
        <div class="person-name-lg">${name}</div>
        <div class="person-relation-lg">${cat.name}</div>
      </div>
    </div>
    <div class="person-summary">
      <div class="person-sum-tag net">总往来 ${personRecs.length} 笔</div>
      <div class="person-sum-tag net">净盈亏 ${formatCurrency(net)}</div>
    </div>
    <div class="person-stats-body">
      <div class="person-ring-wrap">
        <svg width="104" height="104" viewBox="0 0 104 104">
          <circle cx="52" cy="52" r="43" fill="none" stroke="#F0DDD0" stroke-width="9"/>
          <circle cx="52" cy="52" r="43" fill="none" stroke="${net>=0?'#2E9D5A':'#C4702A'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="270.18" stroke-dashoffset="${270.18*(1-Math.min(Math.abs(net)/Math.max(Math.abs(sentTotal),Math.abs(recTotal),1),1))}" transform="rotate(-90 52 52)" style="transition:stroke-dashoffset .8s ease"/>
        </svg>
        <div class="person-ring-text">
          <div class="person-ring-label">净盈亏</div>
          <div class="person-ring-val">${formatCurrency(net)}</div>
        </div>
      </div>
      <div class="person-stat-list">
        <div class="person-stat-row"><span class="person-stat-label">人情总支出</span><span class="person-stat-val">${formatCurrency(sentTotal)}</span></div>
        <div class="person-stat-row"><span class="person-stat-label">人情总收入</span><span class="person-stat-val">${formatCurrency(recTotal)}</span></div>
        <div class="person-stat-row"><span class="person-stat-label">待随礼</span><span class="person-stat-val" style="color:var(--primary)">${formatCurrency(pendingSent)}</span></div>
        <div class="person-stat-row"><span class="person-stat-label">待收礼</span><span class="person-stat-val" style="color:var(--green)">${formatCurrency(pendingRec)}</span></div>
      </div>
    </div>`;

  // Timeline - group by month
  const sorted = [...personRecs].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const months = {};
  sorted.forEach(r => {
    const d = new Date(r.date);
    const key = `${d.getFullYear()}年${d.getMonth()+1}月`;
    if(!months[key]) months[key] = [];
    months[key].push(r);
  });

  // Balance section (inserted before timeline)
  let tlHtml = `<div class="person-balance-section">
    <div class="pbs-title">💰 人情收支</div>
    <div class="pbs-grid">
      <div class="pbs-item"><div class="pbs-item-label">人情收入</div><div class="pbs-item-val income">${formatCurrency(recTotal)}</div></div>
      <div class="pbs-item"><div class="pbs-item-label">人情支出</div><div class="pbs-item-val expense">${formatCurrency(sentTotal)}</div></div>
      <div class="pbs-item"><div class="pbs-item-label">人情结余</div><div class="pbs-item-val ${net>=0?'balance-pos':'balance-neg'}">${formatCurrency(net)}</div></div>
    </div>
  </div>`;
  Object.keys(months).forEach(mKey => {
    const mRecs = months[mKey];
    tlHtml += `<div class="month-header">${mKey.replace(/年(\d+)月/,m=>m.match(/\d+/)[0]+'月')} ${new Date(mKey).getFullYear()}</div>`;
    mRecs.forEach(r => {
      const isNeg = r.type==='sent';
      tlHtml += `<div class="timeline-item" style="display:flex;align-items:flex-start">
        <div class="timeline-dot"></div>
        <div class="timeline-info">
          <div><span class="timeline-amount ${isNeg?'negative':'positive'}">${isNeg?'-':'+'}${r.amount.toLocaleString()}</span><span class="timeline-type">· ${isNeg?'送出':'收回'}</span></div>
          <div class="timeline-date">${formatDateCN(r.date)}</div>
          ${r.note?`<div class="timeline-note">${r.note}</div>`:''}
          <div class="timeline-actions">
            <button class="tl-action" onclick="openEditModal(${r.id});closePersonPage();" title="编辑">✎</button>
            <button class="tl-action del" onclick="confirmDelete(${r.id});" title="删除">🗑</button>
          </div>
        </div>
      </div>`;
    });
  });
  document.getElementById('personTimeline').innerHTML = tlHtml || '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无往来记录</div></div>';

  document.getElementById('personPage').classList.add('show');
}
function closePersonPage() { document.getElementById('personPage').classList.remove('show'); }

// ============ Balance Overview ============
function openBalanceOverview() {
  renderBalanceOverview();
  document.getElementById('balancePage').classList.add('show');
}
function closeBalanceOverview() { document.getElementById('balancePage').classList.remove('show'); }

function renderBalanceOverview() {
  // Global totals
  const totalIncome = records.filter(r=>r.type==='received').reduce((s,r)=>s+r.amount,0);
  const totalExpense = records.filter(r=>r.type==='sent').reduce((s,r)=>s+r.amount,0);
  const net = totalIncome - totalExpense;
  const total = Math.max(totalIncome + totalExpense, 1);

  // Header
  document.getElementById('balanceHeaderContent').innerHTML = `
    <div class="balance-nav">
      <div class="balance-back" onclick="closeBalanceOverview()">‹</div>
      <div class="balance-title">人情往来总数据</div>

function saveRecord(e) {
  e.preventDefault();
  const name = document.getElementById('inputName').value.trim();
  const amount = parseInt(document.getElementById('inputAmount').value);
  const type = currentTypeTab;
  const date = document.getElementById('inputDate').value;
  const note = document.getElementById('inputNote').value.trim();
  const relation = getSelectedCat();
  if(!name || !amount || !date || !relation) { showToast('请填写完整信息'); return; }

  const subRelation = relation==='relatives' ? getSelectedSubCat() : null;

  if(editingId) {
    const idx = records.findIndex(r=>r.id===editingId);
    if(idx !== -1) records[idx] = {...records[idx], name, amount, type, date, note, relation, subRelation};
    showToast('已更新 ✓');
  } else {
    const newId = records.length ? Math.max(...records.map(r=>r.id)) + 1 : 1;
    records.push({id:newId, name, amount, type, status: type==='received'?'settled':'pending', date, note, relation, subRelation});
    showToast('已添加 ✓');
  }
  saveData(); closeModal(); renderAll();
}

const REL_MAP={'relatives':'亲戚','colleagues':'同事','friends':'朋友','classmates':'同学','others':'其他'};

const SUB_MAP={'mom':'妈妈亲戚','dad':'爸爸亲戚','inlaw':'婆家亲戚'};

    ]);

// ============ 导入 Excel ============
function importData(){ document.getElementById('importFile').click(); }

function excelDateToStr(v){
  if(v instanceof Date) return fmtDate(v);
  if(typeof v==='number'){ const d=new Date(Math.round((v-25569)*86400)*1000); return fmtDate(d); }
  const m=String(v).match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:String(v).trim();
}
function fmtDate(d){
  const y=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');
  return `${y}-${mo}-${da}`;
}
function nextId(){ return records.length?Math.max(...records.map(r=>r.id))+1:1; }

function handleImportFile(input){
  const f=input.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(rows.length<2){ showToast('文件里没有数据'); input.value=''; return; }
      const headers=rows[0].map(h=>String(h).trim());
      const idx={}; headers.forEach((h,i)=>idx[h]=i);
      const get=(row,key)=>{ const i=idx[key]; return i!==undefined?row[i]:''; };
      const imported=[];
      for(let i=1;i<rows.length;i++){
        const row=rows[i]; if(!row||!String(get(row,'姓名')||'').trim()) continue;
        const type=get(row,'类型')==='人情收入'?'received':'sent';
        const name=String(get(row,'姓名')).trim();
        const date=excelDateToStr(get(row,'日期'));
        const amount=parseFloat(String(get(row,'金额')).replace(/[^\d.]/g,''))||0;
        const relKey=REL_REV[get(row,'关系')]||'others';
        const subKey=relKey==='relatives'?(SUB_REV[get(row,'亲戚分组')]||null):null;
        const statusText=String(get(row,'状态')).trim();
        const status=type==='received'?'settled':(statusText==='待回礼'?'pending':'settled');
        imported.push({id:0,name,relation:relKey,subRelation:subKey,amount,type,date,status,note:String(get(row,'备注')||'').trim()});
      }
      // 合并去重（按 姓名+日期+金额+类型）
      let added=0;
      imported.forEach(r=>{
        const dup=records.some(x=>x.name===r.name&&x.date===r.date&&x.amount===r.amount&&x.type===r.type);
        if(!dup){ r.id=nextId(); records.push(r); added++; }
      });
      saveData(); renderAll();
      showToast(added>0?`已导入 ${added} 条新记录 ✓`:'没有新增记录（可能已导入过）');
    }catch(err){ console.error(err); showToast('导入失败：请确认是导出的 Excel 文件'); }
    input.value='';
  };
  reader.readAsArrayBuffer(f);
}

const SURNAMES='王李张刘陈杨赵黄周吴徐孙朱马胡郭林何高梁郑罗宋谢唐韩冯于董萧程曹袁邓许傅沈曾彭吕苏卢蒋蔡贾丁魏薛叶阎余潘杜戴夏钟汪田任姜范方石姚谭廖邹熊金陆郝孔白崔康毛邱秦江史顾侯邵孟龙万段钱汤尹黎易常武乔贺赖龚文';

// 常见事由关键词（用于从人名后截取备注）
const EVENT_KEYWORDS = [
  '生孩子','满月酒','百日宴','周岁宴','升学宴','乔迁新居','搬家',
  '结婚','婚礼','订婚','领证','离婚','再婚',
  '生日','寿宴','大寿','祝寿','过寿',
  '生病住院','手术','看病','康复',
  '去世','葬礼','白事','丧事','祭奠',
  '开业','升职','升迁','调动','退休','离职',
  '考上大学','毕业','参军','入伍','退伍',
  '买房','买车','装修','还钱','借钱'
];
const PREFIX_KW = ['随','给','送','包','出','转','跟','同'];
// 中间出现的连接词（从名字中剥离）
const MID_KW = ['随我','给我','送我','转我','跟我','同我','随了','给了'];

function splitNameAndNote(rawText){
  // rawText 是年份之后、金额之前的中文部分，如 "随小飞生孩子" 或 "小飞随我生孩子"
  let s = rawText.trim();
  // 先去掉前缀动词
  PREFIX_KW.forEach(k => { if(s.startsWith(k)) s=s.slice(1); });
  // 去掉中间的连接词（如"小飞随我生孩子" -> "小飞生孩子"）
  MID_KW.forEach(k => {
    const idx=s.indexOf(k);
    if(idx>0) s=s.slice(0,idx)+s.slice(idx+k.length);
  });

  // 尝试按常见事由关键词切分：找到第一个事由词的位置
  let bestPos = -1; let foundEvent = '';
  EVENT_KEYWORDS.forEach(ev => {
    const idx = s.indexOf(ev);
    if(idx > 0 && (bestPos < 0 || idx < bestPos)){ bestPos=idx; foundEvent=ev; }
  });

  if(bestPos > 0){
    // 找到了事由关键词，前面是人名
    return {name:s.slice(0,bestPos), note:s.slice(bestPos)};
  }

  // 没有匹配到事由关键词：尝试按长度推断
  // 中文姓名通常 2-4 字；超过 4 字的后面部分很可能是事由
  if(s.length <= 4){ return {name:s, note:''}; }
  // 超过 4 字时，取前 2-3 字作为名字（常见姓氏+名），剩余为备注
  // 检查前缀是否是姓氏
  const surm = s.match(new RegExp('^(['+SURNAMES+'])'));
  if(surm && s.length >= 5){ return {name:s.slice(0,3), note:s.slice(3)}; }
  if(s.length >= 6){ return {name:s.slice(0,2), note:s.slice(2)}; }
  return {name:s.slice(0,3), note:s.slice(3)};
}

function parseLine(line){
  // Try user's compact format first: "2021随小飞生孩子200" or "2023李姐结婚1000"
  const compactMatch = line.match(/^(\d{4}|\d{2})([\u4e00-\u9fa5]+)(\d{1,8})(?:\s*(?:元|块|块钱|圆))?$/);
  if(compactMatch){
    let year = parseInt(compactMatch[1]);
    year = year < 100 ? (year < 50 ? 2000+year : 1900+year) : year;
    const rawText = compactMatch[2]; // 年份和金额之间的全部中文
    const amount = Math.round(parseFloat(compactMatch[3]));
    if(!amount || amount <= 0) return null;

    // 智能拆分 人名 + 备注/事由
    const {name, note} = splitNameAndNote(rawText);

    // Detect type from keywords
    const receivedKw=['还礼','回礼','收到','收了','退回','返还','收礼','收你','给你','入账'];
    const sentKw=['随礼','随份子','送礼','礼金','份子','随了','包了','给出','转给你','转你','随份','出礼'];
    let type='sent';
    if(receivedKw.some(k=>line.includes(k)))type='received';
    else if(sentKw.some(k=>line.includes(k)))type='sent';

    // Date: use extracted year, default month/day to today
    const d=new Date();
    const date=formatYMD(year,d.getMonth()+1,d.getDate());

    return{name,amount,type,date,relation:detectRelation(line),note};
  }

  // Fallback: original format
  const amtMatch=line.match(/(?:¥|￥|RMB)?\s*(\d{1,8}(?:\.\d{1,2})?)\s*(?:元|块|块钱|圆| bucks)?/);
  if(!amtMatch)return null;
  const amount=Math.round(parseFloat(amtMatch[1]));
  if(!amount||amount<=0)return null;
  const date=extractDate(line);
  const receivedKw=['还礼','回礼','收到','收了','退回','返还','收礼','收你','给你','入账'];
  const sentKw=['随礼','随份子','送礼','礼金','份子','随了','包了','给出','转给你','转你','随份','出礼'];
  let type='sent';
  if(receivedKw.some(k=>line.includes(k)))type='received';
  else if(sentKw.some(k=>line.includes(k)))type='sent';
  const relation=detectRelation(line);
  const name=extractName(line);
  if(!name)return null;
  return{name,amount,type,date,relation,note:''};
}

function extractDate(line){
  let m=line.match(/(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
  if(m)return formatYMD(+m[1],+m[2],+m[3]);
  m=line.match(/(\d{1,2})月(\d{1,2})[日号]/);
  if(m)return formatYMD(new Date().getFullYear(),+m[1],+m[2]);
  if(line.includes('今天'))return formatYMDObj(new Date());
  if(line.includes('昨天')){const d=new Date();d.setDate(d.getDate()-1);return formatYMDObj(d);}
  if(line.includes('前天')){const d=new Date();d.setDate(d.getDate()-2);return formatYMDObj(d);}
  return formatYMDObj(new Date());
}
function detectRelation(line){
  if(/亲戚|爸妈|父母|父|母|舅|姨|叔|姑|伯|堂|表|爷|奶|外公|外婆|侄|外甥|哥|弟|姐|妹|大伯|姑父|舅妈|丈|媳|婿/.test(line))return'relatives';
  if(/同事|领导|老板|总|经理|单位|公司|部门|处|科/.test(line))return'colleagues';
  if(/朋友|哥们|闺蜜|老铁|兄弟|玩/.test(line))return'friends';
  if(/同学|校友|小学|初中|高中|大学|班级|系|校/.test(line))return'classmates';
  if(/邻居|老乡|客户|师傅/.test(line))return'others';
  return'relatives';
}
function extractName(line){
  const re=new RegExp('(['+SURNAMES+'])[\u4e00-\u9fa5]{0,3}(?:先生|女士|小姐|兄弟|姐|哥|叔|姨|舅|婶|弟|妹|总|老师|经理|同学|师傅)?');
  const m=line.match(re);return m?m[0]:null;
}
function formatYMD(y,mo,d){return`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function formatYMDObj(d){return formatYMD(d.getFullYear(),d.getMonth()+1,d.getDate());}

let parsedRecords=[];
function renderParsePreview(list){
  parsedRecords=list;
  const el=document.getElementById('parsePreview');

  // Build flat relation list: 妈妈亲戚/爸爸亲戚/婆家亲戚/同事/同学/其他
  const relOrderKeys = ['mom','dad','inlaw','colleagues','classmates','others'];

  el.innerHTML=`<div class="parse-count">已识别 ${list.length} 条，请核对无误后导入：</div>`+
    list.map((r,i)=>{
      let relOpts = '';
      relOrderKeys.forEach(k => {
        const sub = SUB_CATEGORIES.find(s=>s.key===k);
        if(sub){
          // 子分类：relatives|subKey
          const sel = (r.relation==='relatives' && r.subRelation===k) ? 'selected' : '';
          relOpts += `<option value="relatives|${k}" ${sel}>${sub.name}</option>`;
        } else {
          // 普通分类
          const cat = CATEGORIES.find(c=>c.key===k);
          if(cat){
            const sel = (r.relation===k) ? 'selected' : '';
            relOpts += `<option value="${k}" ${sel}>${cat.name}</option>`;
          }
        }
      });

      return `<div class="parse-item" data-i="${i}">
      <div class="parse-item-head"></div>
      <div class="parse-row"><div class="parse-field"><label>日期</label><input type="date" value="${r.date}" onchange="parsedRecords[${i}].date=this.value"></div></div>
      <div class="parse-row"><div class="parse-field" style="flex:1 1 100%"><label>姓名</label><input type="text" value="${escapeHtml(r.name)}" oninput="parsedRecords[${i}].name=this.value" placeholder="如：王伯伯"></div></div>
      <div class="parse-row"><div class="parse-field"><label>关系</label><select onchange="onParseRelChange(${i},this.value)">${relOpts}</select></div><div class="parse-field"><label>类型</label><select onchange="parsedRecords[${i}].type=this.value"><option value="sent" ${r.type==='sent'?'selected':''}>人情支出</option><option value="received" ${r.type==='received'?'selected':''}>人情收入</option></select></div></div>
      <div class="parse-row"><div class="parse-field" style="flex:1 1 100%"><label>事由 / 备注</label><input type="text" value="${escapeHtml(r.note||'')}" placeholder="如：结婚、生孩子、满月酒..." oninput="parsedRecords[${i}].note=this.value"></div></div>
      <div class="parse-row"><div class="parse-field"><label>金额(元)</label><input type="number" value="${r.amount}" oninput="parsedRecords[${i}].amount=Math.max(0,+$this.value)"></div></div>
    </div>`}).join('')+`<div class="parse-footer"><button class="parse-btn" onclick="confirmImportParsed()">✓ 确认导入 ${list.length} 条</button></div>`;
  setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'end'}),100);
}

// Handle relation change in parse preview (split key|subKey)
function onParseRelChange(i,val){
  const parts=val.split('|');
  parsedRecords[i].relation=parts[0]||'others';
  parsedRecords[i].subRelation=parts[1]||null;
  renderParsePreview(parsedRecords);
}
function removeParsed(i){parsedRecords.splice(i,1);renderParsePreview(parsedRecords);}
function confirmImportParsed(){
  const valid=parsedRecords.filter(r=>r.name&&r.amount>0);
  if(valid.length===0){showToast('没有可导入的有效记录');return;}
  const maxId=records.length?Math.max(...records.map(r=>r.id))+1:1;
  valid.forEach((r,idx)=>records.push({id:maxId+idx,name:r.name.trim(),amount:r.amount,type:r.type,status:r.type==='received'?'settled':'pending',date:r.date,note:r.note||'',relation:r.relation,subRelation:r.subRelation||null}));
  saveData();closePaste();renderAll();showToast(`成功导入 ${valid.length} 条记录 ✓`);
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39'})[c]);}

// ============ Utils ============
function renderAll(){renderStats();renderSidebar();renderMain();}
function formatCurrency(n){const p=n>=0?'':'-';return p+'¥'+Math.abs(n).toLocaleString();}
function formatDateCN(d){const dt=new Date(d);return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`;}
function formatDateMD(d){const dt=new Date(d);return `${dt.getMonth()+1}月${dt.getDate()}日`;}
function daysSince(ds){return Math.max(0,Math.floor((Date.now()-new Date(ds).getTime())/86400000));}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

// Overlay click handlers
document.getElementById('formModal').addEventListener('click',e=>{if(e.target===this)closeModal()});
document.getElementById('chartModal').addEventListener('click',e=>{if(e.target===this)closeChart()});
document.getElementById('pasteModal').addEventListener('click',e=>{if(e.target===this)closePaste()});

init();
</script>
